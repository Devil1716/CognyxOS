syntax = "proto3";

package cognyx.services.agent.v1;

import "cognyx/common/v1/common.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/duration.proto";

option go_package = "cognyxos/api/gen/go/services/agent/v1;agentv1";

// ============================================================
//  TASK LIFECYCLE ENUM
// ============================================================

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  CREATED = 1;
  PLANNING = 2;
  READY = 3;
  RUNNING = 4;
  WAITING = 5;
  BLOCKED = 6;
  PAUSED = 7;
  FAILED = 8;
  RECOVERING = 9;
  COMPLETED = 10;
  CANCELLED = 11;
}

// ============================================================
//  PERMISSIONS & AUTHORIZATION
// ============================================================

enum PermissionDecision {
  PERMISSION_DECISION_UNSPECIFIED = 0;
  ALLOW = 1;
  DENY = 2;
  USER_APPROVAL_REQUIRED = 3;
}

message PermissionContext {
  string user_id = 1;
  string session_id = 2;
  repeated string granted_capabilities = 3;
  bool is_administrator = 4;
}

// ============================================================
//  INTENT MESSAGES
// ============================================================

enum IntentDomain {
  INTENT_DOMAIN_UNSPECIFIED = 0;
  APP_INSTALLATION = 1;
  DOCUMENT_GENERATION = 2;
  DATA_ANALYSIS = 3;
  SESSION_RESUME = 4;
  SYSTEM_OPERATION = 5;
  APPLICATION_EXECUTION = 6;
  FILE_MANAGEMENT = 7;
}

message IntentConstraint {
  string key = 1;
  string value = 2;
  bool is_hard_requirement = 3;
}

message IntentContext {
  string session_id = 1;
  string current_workspace = 2;
  map<string, string> environment_params = 3;
}

message ParsedIntent {
  string intent_id = 1;
  string original_prompt = 2;
  IntentDomain domain = 3;
  string target_object = 4;
  repeated string required_capabilities = 5;
  repeated IntentConstraint constraints = 6;
  map<string, string> parameters = 7;
  float confidence_score = 8;
  google.protobuf.Timestamp parsed_at = 9;
}

message ParseIntentRequest {
  cognyx.common.v1.RequestMetadata meta = 1;
  cognyx.common.v1.CapabilityToken cap = 2;
  string prompt = 3;
  optional IntentContext context = 4;
}

message ParseIntentResponse {
  ParsedIntent intent = 1;
}

// ============================================================
//  PLANNER MESSAGES
// ============================================================

message PlanStep {
  string step_id = 1;
  string description = 2;
  string target_runtime_kind = 3;
  repeated string required_capabilities = 4;
  repeated string depends_on_step_ids = 5;
  map<string, string> parameters = 6;
}

message Plan {
  string plan_id = 1;
  string task_id = 2;
  repeated PlanStep steps = 3;
  google.protobuf.Timestamp created_at = 4;
}

message PlanValidationResult {
  bool is_valid = 1;
  repeated string validation_errors = 2;
  repeated string missing_capabilities = 3;
}

message GeneratePlanRequest {
  string task_id = 1;
  ParsedIntent intent = 2;
}

message GeneratePlanResponse {
  Plan plan = 1;
  PlanValidationResult validation = 2;
}

// ============================================================
//  EXECUTION GRAPH MESSAGES
// ============================================================

enum ExecutionTargetRuntime {
  TARGET_RUNTIME_UNSPECIFIED = 0;
  NATIVE_LINUX = 1;
  WINDOWS_VM = 2;
  MACOS_VM = 3;
  CONTAINER = 4;
}

message ExecutionNode {
  string node_id = 1;
  string task_id = 2;
  string name = 3;
  ExecutionTargetRuntime target_runtime = 4;
  string command = 5;
  repeated string args = 6;
  repeated string depends_on_node_ids = 7;
  repeated string required_capabilities = 8;
  map<string, string> env_vars = 9;
  uint32 timeout_seconds = 10;
  uint32 max_retries = 11;
  string state = 12;
  string input_payload = 13;
  string output_result = 14;
}

message ExecutionGraph {
  string graph_id = 1;
  string task_id = 2;
  repeated ExecutionNode nodes = 3;
  google.protobuf.Timestamp compiled_at = 4;
}

// ============================================================
//  CAPABILITY GATEWAY MESSAGES
// ============================================================

message CapabilityRequest {
  string request_id = 1;
  string task_id = 2;
  string agent_id = 3;
  string capability = 4;
  string target = 5;
  repeated string arguments = 6;
  map<string, string> constraints = 7;
  PermissionContext permission_context = 8;
  uint32 timeout_seconds = 9;
}

message CapabilityResult {
  string request_id = 1;
  bool success = 2;
  string output = 3;
  optional string error = 4;
  string assigned_runtime_id = 5;
  google.protobuf.Timestamp executed_at = 6;
}

// ============================================================
//  TASK MESSAGES & CHECKPOINTING
// ============================================================

message CheckpointState {
  string checkpoint_id = 1;
  string task_id = 2;
  TaskState task_state = 3;
  string execution_graph_id = 4;
  repeated string completed_node_ids = 5;
  map<string, string> node_outputs = 6;
  google.protobuf.Timestamp timestamp = 7;
}

message AgentTask {
  string task_id = 1;
  string intent_id = 2;
  string parent_task_id = 3;
  string user_id = 4;
  string prompt = 5;
  TaskState status = 6;
  uint32 priority = 7;
  repeated string required_capabilities = 8;
  Plan plan = 9;
  ExecutionGraph execution_graph = 10;
  string assigned_runtime = 11;
  CheckpointState checkpoint = 12;
  string result = 13;
  optional string error = 14;
  uint32 retry_count = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
}

message SubmitTaskRequest {
  cognyx.common.v1.RequestMetadata meta = 1;
  cognyx.common.v1.CapabilityToken cap = 2;
  string prompt = 3;
  uint32 priority = 4;
}

message TaskHandle {
  string task_id = 1;
  TaskState status = 2;
  google.protobuf.Timestamp submitted_at = 3;
}

// ============================================================
//  MODEL PROVIDER MESSAGES
// ============================================================

message ModelRequest {
  string model_id = 1;
  string prompt = 2;
  float temperature = 3;
  uint32 max_tokens = 4;
}

message ModelResponse {
  string text = 1;
  uint32 tokens_used = 2;
  string finish_reason = 3;
}

// ============================================================
//  EVENT MESSAGES
// ============================================================

message AgentEvent {
  string event_id = 1;
  string event_type = 2; // e.g. agent.task_created, agent.node_started
  string task_id = 3;
  string payload = 4;
  google.protobuf.Timestamp timestamp = 5;
}

// ============================================================
//  SERVICES DEFINITIONS
// ============================================================

service AgentKernelService {
  rpc SubmitTask(SubmitTaskRequest) returns (TaskHandle);
  rpc GetTaskStatus(TaskHandle) returns (AgentTask);
  rpc PauseTask(TaskHandle) returns (AgentTask);
  rpc ResumeTask(TaskHandle) returns (AgentTask);
  rpc CancelTask(TaskHandle) returns (AgentTask);
  rpc RecoverTask(TaskHandle) returns (AgentTask);
}

service IntentEngineService {
  rpc ParseIntent(ParseIntentRequest) returns (ParseIntentResponse);
}

service TaskManagerService {
  rpc CreateTask(SubmitTaskRequest) returns (AgentTask);
  rpc GetTask(TaskHandle) returns (AgentTask);
}

service PlannerService {
  rpc GeneratePlan(GeneratePlanRequest) returns (GeneratePlanResponse);
}

service CapabilityGatewayService {
  rpc ExecuteCapability(CapabilityRequest) returns (CapabilityResult);
}
