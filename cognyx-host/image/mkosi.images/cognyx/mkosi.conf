[Distribution]
Distribution=ubuntu
Release=noble
Mirror=https://mirror.ubuntu.com/ubuntu

[Output]
Format=disk
Compression=zstd
ImageId=cognyxos
ImageVersion=0.1.0
BaselineSources=false

[Content]
Packages=
    linux-image-generic
    linux-firmware
    systemd
    systemd-sysv
    dbus
    networkd-dispatcher
    qemuguest
    qemu-guest-agent
    python3
    python3-pip
    curl
    ca-certificates
    sudo
    openssh-server
    grub-efi-amd64-signed
    shim-signed
    mtools
    dosfstools
    
BaseTrees=
Overlay=
SkeletonTrees=/workspace/cognyx-host/image/skeleton

BuildPackages=
    debootstrap
    systemd-container
    
BuildTools=
    mkfs.ext4
    e2fsprogs

Mounts=
WorkspaceSize=8G

[Validation]
Key=
Signature=local
Checksum=yes
OpenPGP=
Passphrase=
SecureBoot=no
Timestamp=

[Host]
ProxyUrl=
ProxyPeerCertificate=
ProxyClientCertificate=
ProxyClientKey=
NspawnSettings=
Ephemeral=
Credentials=
ExtraSearchPaths=
Incremental=no
Machine=cognyxos
Seed=
