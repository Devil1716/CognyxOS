# GRUB Configuration for CognyxOS Host
# Bare-metal boot with A/B partition support

set timeout=3
set default=0

# Primary boot entry (Partition A)
menuentry "CognyxOS Host (Partition A)" {
    set root=(hd0,1)
    linux /boot/vmlinuz-cognyx root=/dev/cognyx-root-a ro quiet loglevel=3 cognyx.host_mode=infrastructure intel_iommu=on amd_iommu=on iommu=pt cgroup_no_v1=all
    initrd /boot/initramfs-cognyx.cpio.gz
}

# Secondary boot entry (Partition B - fallback)
menuentry "CognyxOS Host (Partition B)" {
    set root=(hd0,2)
    linux /boot/vmlinuz-cognyx root=/dev/cognyx-root-b ro quiet loglevel=3 cognyx.host_mode=infrastructure intel_iommu=on amd_iommu=on iommu=pt cgroup_no_v1=all
    initrd /boot/initramfs-cognyx.cpio.gz
}

# Recovery mode
menuentry "CognyxOS Recovery" {
    set root=(hd0,1)
    linux /boot/vmlinuz-cognyx root=/dev/cognyx-root-a rw single init=/bin/bash
    initrd /boot/initramfs-cognyx.cpio.gz
}
