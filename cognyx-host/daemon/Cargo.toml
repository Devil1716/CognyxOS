[package]
name = "cognyxd"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "CognyxOS privileged host daemon for VM and resource management"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
nix = { version = "0.29", features = ["net", "sched", "user"] }
libc = "0.2"
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"

[[bin]]
name = "cognyxd"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
codegen-units = 1
