[package]
name = "cognyx-agent-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
dashmap = "5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
thiserror = "1.0"
sha2 = "0.10"
cognyx-intent = { path = "../intent" }
cognyx-resources = { path = "../../resources" }
