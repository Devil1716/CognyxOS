[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognyx-runtime"
version = "0.1.0"
description = "Platform-neutral runtime foundation for CognyxOS."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9.0", "pytest-cov>=7.0", "ruff>=0.14"]
docs = ["mkdocs>=1.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cognyx_runtime --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
